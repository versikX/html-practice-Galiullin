<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица фигур</title>
    <link rel="stylesheet" href="style/style-2.css">
    <style>
        table {
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }
        td, th {
            border: 2px solid #333;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .figure-img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <h1>Таблица фигур 3x2</h1>
    <table>
        <tr>
            <th>Круг</th>
            <th>Квадрат</th>
            <th>Треугольник</th>
        </tr>
        <tr>
            <td> ⚫</td>
            <td>⬛</td>
            <td>🔺</td>
        </tr>
    </table>
    <form action="practice-2.html"><button>← Назад</button></form>
</body>
</html>
