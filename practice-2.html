<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кнопки и ссылки</title>
    <link rel="stylesheet" href="style/style-2.css">
</head>
<body>
    <h1>Кнопки и ссылки в HTML</h1>
    <form action="https://www.google.com">
        <button id="google-btn">
            <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_92x30dp.png" height="30">
            Google
        </button>
    </form>

    <h2>Переход на другие страницы:</h2>
    <form action="page-img.html">
        <button>Описание тега &lt;img&gt;</button>
    </form>
    <form action="page-ul.html">
        <button>Описание тега &lt;ul&gt;</button>
    </form>
    <form action="page-table.html">
        <button>Таблица фигур 3x2</button>
    </form>
    <form action="index.html">
        <button id="back-btn">← Вернуться на главную</button>
    </form>
</body>
</html>
